plugins {
	id 'java'
	id 'org.springframework.boot' version '4.2.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.ai:spring-ai-bom:2.1.0'
	}
}

dependencies {
	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	// ULID (PK)
	implementation 'com.github.f4b6a3:ulid-creator:5.2.3'
	// Spring AI (OpenAI)
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'

	// 소셜 로그인 (Google OAuth2). Boot 4에서 스타터 이름이 security-oauth2-client로 변경됨
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	// 메일 발송 (SMTP). 로컬은 Mailpit, 운영은 환경변수만 바꿔 AWS SES SMTP로 연결
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// 로그인 시도 제한용 인메모리 캐시 (버전은 Boot 관리)
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// API 문서 (Swagger UI). springdoc 3.x가 Spring Boot 4 대응
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'

	// DB 마이그레이션 (Flyway)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 배포용 JAR에 로컬 전용 설정(비밀번호, API 키 등)이 포함되지 않도록 제외
// bootRun은 build/resources를 쓰므로 로컬 실행에는 영향 없음
tasks.named('bootJar') {
	exclude 'application-local.yaml'
}
