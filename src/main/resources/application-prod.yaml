# 운영 프로필 (민감한 값은 환경변수로 주입)

# API 문서 노출 차단
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 소셜 로그인 핸드셰이크용 세션 쿠키는 HTTPS에서만 전송
server:
  servlet:
    session:
      cookie:
        secure: true

# 메일: AWS SES SMTP 등 인증이 필요한 서버를 가정 (MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM은 환경변수)
spring:
  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
