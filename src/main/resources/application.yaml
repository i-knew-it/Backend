spring:
  application:
    name: iknewit

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:iknewit}
    username: ${DB_USERNAME:iknewit}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway(db/migration)가 관리, Hibernate는 검증만 수행
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini

  mail:
    # 기본값은 로컬 Mailpit(docker compose). 운영은 환경변수로 SES SMTP 값을 넣는다
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      # 메일 서버가 느려도 발송 스레드가 오래 매달리지 않도록 제한 (ms)
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  security:
    oauth2:
      client:
        registration:
          google:
            # 값은 환경변수(로컬은 application-local.yaml)로 주입. 없으면 기동 실패
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # openid를 빼서 일반 OAuth2(userinfo 조회)로 처리 → 이후 카카오도 같은 경로로 추가 가능
            scope: profile,email
            # Google Cloud Console의 "승인된 리디렉션 URI"와 정확히 같아야 함
            redirect-uri: "{baseUrl}/auth/oauth2/callback/{registrationId}"

server:
  servlet:
    session:
      # 세션은 소셜 로그인 핸드셰이크(state 저장) 동안에만 잠깐 사용하고 성공 시 폐기한다
      timeout: 5m
      cookie:
        http-only: true
        same-site: lax # Google에서 돌아오는 최상위 이동에는 Lax가 필요 (Strict는 전송 안 됨)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:} # 32바이트 이상 필수 (없으면 기동 실패)
  access-token-expiration: 30m
  refresh-token-expiration: 7d
  # Rotation 직후 이 시간 안에 같은 토큰이 다시 오면 탈취가 아니라 동시 요청(여러 탭 등)으로 본다
  refresh-reuse-grace: 10s

auth:
  rate-limit:
    login-max-failures: 5 # 같은 이메일+IP에서 연속 실패 허용 횟수
    login-block-duration: 15m # 초과 시 차단 시간 (마지막 실패 기준)
    ip-max-per-minute: 20 # IP당 분당 로그인+가입+비밀번호 재설정 시도 상한
    password-reset-max-per-hour: 3 # 같은 이메일로 비밀번호 재설정 메일을 요청할 수 있는 횟수 (메일 폭탄 방지)
    password-reset-window: 1h

app:
  # CORS 허용 origin (쉼표로 여러 개 가능). 쿠키 인증을 쓰므로 "*" 불가. 소셜 로그인 후 리다이렉트는 첫 번째 값 사용
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  # 소셜 로그인 후 프론트 경로 (프론트가 이 경로의 페이지를 구현해야 함)
  oauth2-success-path: /auth/callback
  oauth2-failure-path: /login
  # 비밀번호 재설정 메일의 링크 경로 ({FRONTEND_URL}{경로}?token=...). 프론트가 이 경로의 페이지를 구현해야 함
  password-reset-path: /reset-password
  # 발신 주소. 운영(SES)에서는 SES에서 인증된 주소여야 함
  mail-from: ${MAIL_FROM:no-reply@anunjul.app}
