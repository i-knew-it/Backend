spring:
  application:
    name: iknewit

  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:iknewit}
    username: ${DB_USERNAME:iknewit}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway(db/migration)가 관리, Hibernate는 검증만 수행
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 15m
  refresh-token-expiration: 30d
